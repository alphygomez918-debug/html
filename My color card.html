<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
     /* Universal selector - applies to everything on the page */
        * {
         font-size: 16px;
        }
               
     /* Element selector */
     body {
         background-color:lightgray;
        } 
    
        h1 {
            color: darkblue;
        }
    
        H2 {
            color: purple;
        }
     
        p {
            color: dimgray;
        }
   
      /* Class selector */
        .my detail {
            color: darkgreen;
            font-weight: bold;
        }

      /* ID selector */
        #my-card {
            background-color: lightcyan;
        }
   
   </style>

    <head>
    <body>

        <h1>My color card</h1>


        <p style="color: crimson;">Hi! This is my very own webpage.</p>

        <div id="my-card">
            
            <h2>About Me</h2>
            <p class="my-detail">My name is Sam.</p>
            <p class="my-detail">My favorite color is red.</p>
            <p class="my-detail">My favorite subject is Maths.</p>
            <p class="my-detail">My favorite food is pasta.</p>

        </div>

        <h2>My favorite things</h2>
        <p>My favorite animal is a cat.</p>
        <p>My favorite sport is cricket.</p>
        <p>My favorite movie is The Lion king.</p>

    </body>
</html>
