<!Doctype.html>
<html>
<head>
  <title>Superhero Card</title>
  <style>

    /* Typography - font, size, weight, colour for the whole page */
    body {
      background-color: darkblue;
      color: white;
      font-family: Areal, sans-serif;
    }
     
    /* Typography + Textshadow - big bold title with an orange shadow */
    .hero-name {
      font-size: 60px;
      font-weight: bold;
      color: yellow;
        text-shadow: 3px 3px orange;
    }

    /* Typography + Texttransform - tagline becomes Title Case */
    .tagline {
      font-style: italic;
      color: lightblue;
      text-transform: capitalize;
    }

    /* Texttransform + Text Decoration - scetions headings in CAPS with underline */
    .label {
      text-transform: uppercase;
      text-decoration: underline;
      color: coral;
    }

    /* Typography - power stands out in bold green */
    .power {
      font-weight: bold;
      color: lightgreen;
    }

    /* Text Decoration - weakness are crossed out*/
    .weakness {
      text-decoration: line-through;
      color: gray;
    }

   /* Transform - the badge is titled through the side */
   .badge {
     font-size: 28px;
     font-weight: bold;
     color: gold;
     transform: rotate(15deg);
    }

    /* Typography - footer text */
    .made-by {
      color:coral;
      font-style: italic;
    }

    </style>
</head>
<body>

  <h1 class="hero-name">Thunder Kid</h1>
  <p class="tagline">the most powerful hero in the school</p>

  <h2 class="label">Super powers</h2>
  <p class="power">can run faster than a cheetah</p>
  <p class="power">Can lift a school bus</p>

  <h2 class="label">Weaknesses</h2>
  <p class="weakness">Maths homework</p>
  <p class="weakness">Broccoli</p>

  <p class="badge">Top hero

  <p class="made-by">Created by__________</p>

</body>
</html>
